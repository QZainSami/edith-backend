[project]
name = "edith-milestone-4"
version = "0.1.0"
description = "EDITH local chat backend and ESP32 OLED mood control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
